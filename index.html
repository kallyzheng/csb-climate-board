<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSB Climate Job Board — Pipeline Metrics</title>
</head>
<body style="margin:0">

<style>
  /* ── DESIGN TOKENS ───────────────────────────────────────────────
     Documented in BRAND.md at the repo root: what each token is for,
     which are safe to change, the validation procedure, and why the
     sector palette is NOT a branding surface. Read it before editing.
     Tokens are declared THREE times (light, media-dark, data-theme
     dark) — change all three together. */
  .viz-root{
    color-scheme: light;
    /* Surface carries a faint violet cast so the NYU accent reads as
       intentional rather than applied. Sector palette re-validated against it:
       all six still pass. */
    --surface-1:#faf8fc; --surface-2:#f3f0f7; --border:#e5e0ec;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#77756f;
    /* Sector hues at 85%% chroma. Hue (identity) is untouched; only
       saturation drops, so they sit quieter against the muted violet
       surface without collapsing into each other. 85%% is the floor:
       at 75%% the dark set fails (normal-vision delta-E 14.6, under 15).
       This trades CVD separation from the >=8 target down to the 6-8
       band, which is legal ONLY because identity is never colour-alone
       here -- every chart has a named legend with values and a table
       view. Restore full chroma by reverting to the values in the
       comment below if that ever stops being true. */
    /* full-chroma originals: #2a78d6 #eb6834 #1baf7a #eda100 #e87ba4 #008300 */
    --s1:#3b79c8; --s2:#e07148; --s3:#41ac7e; --s4:#e5a53f; --s5:#df82a4; --s6:#278024;
    /* Neutral sits on the VIOLET axis (OKLCH h 300), not the warm h 95 it
       had for the old graphite surface -- a 204 degree mismatch against a
       violet-tinted surface, which is why it read as discordant. Chroma is
       ~17% of the accent's, so it still reads as grey, and separation from
       the accent stays at delta-E 39.2. */
    --neutral:#a8a3b3;
    /* NYU Violet, sampled from the NYUGreen lockup. Deliberately NOT --s1:
       the accent used to be #2a78d6, the same blue as sector slot 1, so the
       funnel read as "Electricity". Violet appears in no sector slot.
       10.99:1 here; white on it 11.6:1. */
    --accent:#57068c; --on-accent:#ffffff; --brand-green:#457724;
    /* Funnel is ORDINAL (pipeline stages): one hue, monotone lightness -- not
       six categorical hues, which would imply unrelated categories. fn1 sits
       nearest the surface at 3.23:1, well clear of the 2:1 floor, because a
       step that merely passes still visibly fades out. */
    --fn1:#a179cf; --fn2:#8a60b7; --fn3:#7347a0;
    --fn4:#5d2d89; --fn5:#481073; --fn6:#34005d;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])) .viz-root{
      color-scheme: dark;
      --surface-1:#17131f; --surface-2:#201a2b; --border:#362c46;
      --text-primary:#f6f2fa; --text-secondary:#c6bdd2; --text-muted:#948aa3;
      /* full-chroma originals: #3987e5 #d95926 #199e70 #c98500 #d55181 #008300 */
      --s1:#4988d7; --s2:#ce633b; --s3:#3a9b74; --s4:#c28833; --s5:#cb5c82; --s6:#278024;
      /* Neutral sits on the VIOLET axis (OKLCH h 300), not the warm h 95 it
      had for the old graphite surface -- a 204 degree mismatch against a
      violet-tinted surface, which is why it read as discordant. Chroma is
      ~17% of the accent's, so it still reads as grey, and separation from
      the accent stays at delta-E 18.8. */
      --neutral:#6b6676;
      /* Dark is SELECTED, not flipped: NYU Violet #57068c scores 1.50:1 on this
         surface and is unusable. Same hue, lighter step -> 5.54:1. Being light it
         needs DARK text, hence --on-accent inverting. Green likewise comes from
         the lockup's own dark variant (#7cb247, 7.24:1), not a computed step. */
      --accent:#a778dc; --on-accent:#1a1a19; --brand-green:#7cb247;
      --fn1:#77579c; --fn2:#926ebb; --fn3:#ad85db;
      --fn4:#c99dfd; --fn5:#e6b6ff; --fn6:#ffcfff;
    }
  }
  :root[data-theme="dark"] .viz-root{
    color-scheme: dark;
    --surface-1:#17131f; --surface-2:#201a2b; --border:#362c46;
    --text-primary:#f6f2fa; --text-secondary:#c6bdd2; --text-muted:#948aa3;
    /* full-chroma originals: #3987e5 #d95926 #199e70 #c98500 #d55181 #008300 */
    --s1:#4988d7; --s2:#ce633b; --s3:#3a9b74; --s4:#c28833; --s5:#cb5c82; --s6:#278024;
    /* Neutral sits on the VIOLET axis (OKLCH h 300), not the warm h 95 it
    had for the old graphite surface -- a 204 degree mismatch against a
    violet-tinted surface, which is why it read as discordant. Chroma is
    ~17% of the accent's, so it still reads as grey, and separation from
    the accent stays at delta-E 18.8. */
    --neutral:#6b6676;
    /* Dark is SELECTED, not flipped: NYU Violet #57068c scores 1.50:1 on this
       surface and is unusable. Same hue, lighter step -> 5.54:1. Being light it
       needs DARK text, hence --on-accent inverting. Green likewise comes from
       the lockup's own dark variant (#7cb247, 7.24:1), not a computed step. */
    --accent:#a778dc; --on-accent:#1a1a19; --brand-green:#7cb247;
    --fn1:#77579c; --fn2:#926ebb; --fn3:#ad85db;
    --fn4:#c99dfd; --fn5:#e6b6ff; --fn6:#ffcfff;
  }

  .viz-root{
    font-family: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--surface-1); color:var(--text-primary);
    padding:28px 32px 56px; max-width:1600px; margin:0 auto; line-height:1.45;
  }
  /* Masthead. Two <img> rather than one swapped src so the correct lockup is
     in the markup for both themes and neither flashes on load. */
  /* ── Pitch-yourself guide ───────────────────────────────────────── */
  .lede{font-size:.92rem;color:var(--text-primary);margin:0 0 6px;line-height:1.5}
  .stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 26px}
  @media(min-width:760px){ .stat{grid-template-columns:repeat(4,1fr)} }
  .stat div{background:var(--surface-2);border:1px solid var(--border);
    border-left:3px solid var(--accent);border-radius:0 9px 9px 0;padding:11px 13px}
  .stat .n{font-size:1.3rem;font-weight:660;font-variant-numeric:tabular-nums;
    color:var(--text-primary)}
  .stat .c{font-size:.7rem;color:var(--text-secondary);margin-top:3px;line-height:1.35}
  /* Screenshot walkthrough. The images are dark-mode captures of Notion, so
     they are framed rather than dropped straight onto the page -- on a light
     background an unframed dark screenshot reads as a rendering fault. The
     frame gives it an intentional edge in both themes. */
  .shots{counter-reset:sh;list-style:none;padding:0;margin:14px 0 0;
    display:grid;grid-template-columns:1fr;gap:26px}
  /* Two columns, not three: step 1's capture is a 17:1 banner of the filter
     bar, and in a third of the width its text renders ~5px. It spans instead,
     leaving the two tall dropdown captures side by side beneath it. */
  @media(min-width:1000px){
    .shots{grid-template-columns:repeat(2,1fr);align-items:start}
    .shots li:first-child{grid-column:1/-1}
  }
  .shots li{counter-increment:sh;position:relative;padding:0 0 0 32px}
  .shots li::before{content:counter(sh);position:absolute;left:0;top:1px;width:21px;height:21px;
    border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.68rem;
    font-weight:700;display:grid;place-items:center}
  .shots p{font-size:.82rem;color:var(--text-secondary);margin:0 0 10px;line-height:1.5}
  .shots b{color:var(--text-primary)}
  .shots figure{margin:0;background:#191919;border:1px solid var(--border);border-radius:8px;
    padding:7px;overflow:hidden}
  /* max-height keeps the tall dropdown captures from running a full screen
     each; width:auto with it stops them stretching out of proportion. */
  .shots img{display:block;max-width:100%;max-height:620px;width:auto;height:auto;
    margin:0 auto;border-radius:4px}
  .faq{margin:12px 0 0;display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:1000px){ .faq{grid-template-columns:repeat(3,1fr);gap:0 34px} }
  .faq dt{font-size:.84rem;font-weight:660;color:var(--text-primary);margin:0 0 5px}
  .faq dd{margin:0 0 20px;font-size:.82rem;color:var(--text-secondary);line-height:1.5}
  .faq .faqfull{grid-column:1/-1;margin:4px 0 0;padding-top:14px;
    border-top:1px solid var(--border)}
  .steps{counter-reset:st;list-style:none;padding:0;margin:6px 0 0}
  .steps li{counter-increment:st;position:relative;padding:0 0 0 32px;margin:0 0 14px;
    font-size:.82rem;color:var(--text-secondary);max-width:76ch;line-height:1.5}
  .steps li::before{content:counter(st);position:absolute;left:0;top:0;width:21px;height:21px;
    border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.68rem;
    font-weight:700;display:grid;place-items:center}
  .steps b{color:var(--text-primary)}
  .stage{display:grid;grid-template-columns:78px 1fr;gap:9px 14px;font-size:.8rem;
    color:var(--text-secondary);margin:10px 0 0;max-width:76ch;line-height:1.5}
  .stage dt{font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}
  .stage dd{margin:0}
  .cta{background:var(--surface-2);border:1px solid var(--border);
    border-left:3px solid var(--brand-green);border-radius:0 10px 10px 0;padding:15px 17px;
    margin:24px 0 0;font-size:.82rem;color:var(--text-secondary);line-height:1.5}
  .cta b{color:var(--text-primary)}
  /* The guide is laid out ACROSS the width rather than stacked, purely to cut
     its vertical height -- stacked it ran ~1400px and pushed the table off
     screen. The embed stays FULL WIDTH: narrowing it into a side column would
     hurt the one thing people actually came to read. */
  .phead{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  .pguide{display:grid;grid-template-columns:1fr;gap:24px 34px;align-items:start;margin-top:4px}
  .pguide > *{min-width:0}
  .pguide h2{margin-top:0}
  .pfull{grid-column:1/-1}
  @media(min-width:900px){ .pguide{grid-template-columns:1fr 1fr} }
  @media(min-width:1280px){ .pguide{grid-template-columns:1fr 1fr 1fr} }
  /* columns are narrower than the page, so bring the reading measure down too */
  .pguide .steps li,.pguide .stage,.pguide .h2note{max-width:60ch}
  .phead .stat{margin:6px 0 0}
  /* ── Tabs ────────────────────────────────────────────────────────
     Three panels: two Notion embeds and the metrics. Split because the
     audiences differ -- a student wants the boards and never the funnel;
     CSB/NYU want the funnel and don't need to scroll a job table. Stacking
     two 620px iframes ahead of the metrics would bury them anyway. */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 20px;
    flex-wrap:wrap}
  .tabs button{font:inherit;font-size:.82rem;font-weight:560;padding:9px 15px;
    background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
    color:var(--text-secondary);cursor:pointer;border-radius:6px 6px 0 0}
  .tabs button:hover{color:var(--text-primary);background:var(--surface-2)}
  .tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);
    font-weight:660}
  .tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  [role="tabpanel"][hidden]{display:none}
  .brand{display:flex;align-items:center;gap:20px;margin:0 0 16px;
    background:#fff;border-radius:10px;padding:12px 16px;width:fit-content;
    max-width:100%;flex-wrap:wrap}
  /* Matched on TYPE SIZE, not box height, and the ratio is measured rather
     than guessed: NYU Green's wordmark fills 98% of its box, while CSB's
     "NYU STERN" line is only 31% of its own. Equal box heights therefore
     render NYU Green's lettering about three times the size of CSB's. At
     66px, CSB's wordmark is ~20px tall, so NYU Green needs a ~22px box to
     put the same-size letters beside it. */
  .lockup{width:auto;display:block}
  .lockup-csb{height:66px}
  .lockup-green{height:18px}
  .brandsep{width:1px;align-self:stretch;background:#d9d3e1;flex:0 0 auto}
  /* Same 66:18 ratio, scaled down — not two independently chosen numbers, or
     the balance tuned above comes apart on a phone. */
  @media(max-width:620px){
    .lockup-csb{height:50px} .lockup-green{height:14px}
    .brand{gap:14px;padding:10px 13px} .brandsep{display:none}
  }
  .brandrule{height:3px;border-radius:2px;margin:0 0 22px;
    background:linear-gradient(90deg,var(--accent) 0 62%,var(--brand-green) 62% 100%)}
  h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.015em}
  .sub{color:var(--text-secondary);font-size:.85rem;margin:0 0 6px}
  .asof{color:var(--text-muted);font-size:.75rem;margin:0 0 30px}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;
     color:var(--brand-green);margin:40px 0 4px;font-weight:600}
  .h2note{color:var(--text-muted);font-size:.75rem;margin:0 0 16px}
  /* charts/tables/tiles fill the width; running text past ~78 chars a
     line just gets harder to read, so prose keeps its own cap. */
  .sub,.asof,.h2note{max-width:78ch}
  .note{max-width:88ch}
  section:first-of-type h2{margin-top:8px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
  .tile{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
  .tile .v{font-size:1.55rem;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .l{font-size:.73rem;color:var(--text-secondary);margin-top:3px}
  .tile .d{font-size:.68rem;color:var(--text-muted);margin-top:2px}

  .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
  .ctl button{font:inherit;font-size:.75rem;padding:5px 11px;border-radius:999px;
    border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);cursor:pointer}
  .ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .ctl .lbl{font-size:.72rem;color:var(--text-muted);margin-right:2px}

  .pies{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:28px;align-items:start;margin-top:8px}
  .pie figcaption{font-size:.78rem;font-weight:600;color:var(--text-primary);margin-bottom:2px}
  .pie .den{font-size:.72rem;color:var(--text-muted);margin-bottom:8px}
  .pie svg{max-width:300px;margin:0 auto}
  .plg{list-style:none;padding:0;margin:10px 0 0;font-size:.75rem}
  .plg li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;
    align-items:center;padding:2px 0}
  .plg .pc{font-variant-numeric:tabular-nums;color:var(--text-primary);font-weight:600}
  .plg .vv{font-variant-numeric:tabular-nums;color:var(--text-muted);min-width:62px;text-align:right}
  .legend{display:flex;flex-wrap:wrap;gap:11px;margin:12px 0 0;font-size:.75rem;color:var(--text-secondary)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:2px;flex:none}

  .chart{width:100%;overflow-x:auto}
  svg{display:block;max-width:100%;height:auto}
  .grid line{stroke:var(--border);stroke-width:1}
  .axis text{fill:var(--text-muted);font-size:10px}
  .vlabel{fill:var(--text-secondary);font-size:10px;font-variant-numeric:tabular-nums}
  .rowlabel{fill:var(--text-primary);font-size:11.5px}

  table{border-collapse:collapse;width:100%;font-size:.79rem;margin-top:6px}
  th,td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
  th{color:var(--text-secondary);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
  tfoot td{font-weight:650;border-bottom:none}
  details{margin-top:14px}
  summary{cursor:pointer;font-size:.75rem;color:var(--text-secondary)}

  .note{background:var(--surface-2);border-left:3px solid var(--neutral);border-radius:0 7px 7px 0;
        padding:11px 14px;font-size:.79rem;color:var(--text-secondary);margin:18px 0 0}
  .note b{color:var(--text-primary)}
  a{color:var(--accent)}
  .embed{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
  .embed iframe{display:block;width:100%;height:620px;border:0}
  @media(max-width:640px){ .embed iframe{height:460px} }
  .boardcard{display:flex;align-items:center;gap:16px;text-decoration:none;
    border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;
    background:var(--surface-2);padding:18px 20px;transition:border-color .15s,transform .15s}
  .boardcard:hover{border-color:var(--accent);transform:translateY(-1px)}
  .boardcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bc-main{display:flex;flex-direction:column;gap:3px;min-width:0}
  .bc-t{font-size:1.02rem;font-weight:640;color:var(--text-primary)}
  .bc-s{font-size:.79rem;color:var(--text-secondary)}
  .bc-arrow{margin-left:auto;font-size:1.25rem;color:var(--accent);flex:none}
  @media(prefers-reduced-motion:reduce){ .boardcard{transition:none} .boardcard:hover{transform:none} }
  .funnel{display:grid;gap:7px;margin-top:4px}
  .fr{display:grid;grid-template-columns:190px 1fr 92px;gap:11px;align-items:center;font-size:.8rem}
  .fbar{height:24px;border-radius:4px;background:var(--accent);min-width:2px}
  .fr .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:.76rem}
  @media(max-width:640px){ .fr{grid-template-columns:130px 1fr 76px} }
</style>

<div class="viz-root">
  <!-- Co-branding, required by the grant. Both marks are set to the SAME
       HEIGHT, which is the standard co-brand convention; matching widths
       instead would blow the CSB lockup up to twice the page title, because
       the two have very different aspect ratios (2.9:1 against 6.8:1).

       Both sit on a white plaque in BOTH themes. The CSB lockup is supplied
       only as black-and-violet on white, and recolouring or inverting another
       organisation's mark to suit a dark background breaches their brand
       guidelines -- it is not ours to restyle. The plaque is near-invisible on
       the light theme and reads as a deliberate card on the dark one. That is
       also why the NYU Green LIGHT variant is used here rather than its dark
       one: on white, the dark variant is the wrong asset. -->
  <div class="brand">
    <img class="lockup lockup-csb" src="csb-lockup.png" width="600" height="206"
         alt="NYU Stern Center for Sustainable Business">
    <span class="brandsep" aria-hidden="true"></span>
    <img class="lockup lockup-green" src="nyugreen-lockup-light.png" width="2083" height="307"
         alt="NYU Green">
  </div>
  <h1>CSB Climate Job Board has moved to a new location</h1>
      <div class="brandrule"></div>
</div>

</body>
</html>
